interface:
  display_name: "OpenTodo Implement Issue"
  short_description: "Implement issues with TDD and reviewed, ready PRs"
  default_prompt: "Use $opentodo-implement-issue to implement the linked issue with behavior-focused TDD and small PRs, using gh-stack as needed and opentodo-review-pr to resolve reviews and deliver verified ready PRs."
